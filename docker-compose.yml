# Log rotation for every service: unbounded container logs eventually fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Run everything:  docker compose up --build
# Demo data (10 rooms, sample users) is loaded because APP_PROFILE defaults to "demo".
# For a real deployment: copy .env.example to .env, set real secrets and APP_PROFILE=prod.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: ${DB_USER:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready alone is not enough: it reports "ready" while the init-time temporary server is up,
      # before the database exists. A real query against the target database avoids that race.
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d booking -tAc 'select 1' | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-demo}
      DB_URL: jdbc:postgresql://db:5432/booking
      DB_USER: ${DB_USER:-booking}
      DB_PASSWORD: ${DB_PASSWORD:-booking}
      # DEV DEFAULTS - override through .env in any shared/production environment
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345!}
    ports:
      # Bound to localhost on purpose: clients must go through nginx (:8088), which sets the real client IP and
      # applies the rate limits. Published on all interfaces, anyone could call the app directly and spoof headers.
      - "127.0.0.1:8080:8080" # API + Swagger UI; the management port 8081 (health/metrics) is not published at all
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO_HINT: ${DEMO_HINT:-true} # shows demo credentials on the login page; set false in production
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80" # <- open this: http://localhost:8088
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
