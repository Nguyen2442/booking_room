server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  # Same-origin API: no CORS needed, and the browser never talks to the backend port directly.
  # Host must keep the port ($http_host, not $host): browsers send Origin with the port and Spring
  # rejects the request as "cross-origin" (403) if Host and Origin disagree.
  location /api/ {
    proxy_pass http://app:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location ~ ^/(swagger-ui|v3/api-docs) {
    proxy_pass http://app:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets are immutable
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback; index.html itself must never be cached so deploys are picked up
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
