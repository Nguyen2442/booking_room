# Edge protection. Limits are generous because a whole office can sit behind one NAT address.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;

  # Every payload of this API is tiny; the app enforces the same 64 KB limit.
  client_max_body_size 64k;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  # Same-origin API: no CORS needed, and the browser never talks to the backend port directly.
  # Host must keep the port ($http_host, not $host): browsers send Origin with the port and Spring
  # rejects the request as "cross-origin" (403) if Host and Origin disagree.
  #
  # X-Forwarded-For is OVERWRITTEN with the real peer address, never appended to. If a client could send its own
  # value, the login throttle (keyed by IP) could be bypassed by rotating a fake header. If another proxy or load
  # balancer sits in front of this nginx, configure nginx's realip module for it instead.
  location = /api/v1/auth/login {
    limit_req zone=login burst=30 nodelay;
    proxy_pass http://app:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location /api/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://app:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location ~ ^/(swagger-ui|v3/api-docs) {
    proxy_pass http://app:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets are immutable
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback; index.html itself must never be cached so deploys are picked up
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
