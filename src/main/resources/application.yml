spring:
  application:
    name: meeting-room-booking
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 5000
      max-lifetime: 1500000
      # Never wait forever: a stuck lock or runaway query must fail fast instead of piling up requests.
      connection-init-sql: "SET lock_timeout = '5s'; SET statement_timeout = '15s'; SET idle_in_transaction_session_timeout = '30s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    # its own connection: migrations must not inherit the short statement_timeout above
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [%X{requestId:-}] [%X{userId:-}]"
  level:
    # A booking conflict is a normal business outcome. Hibernate would log it as ERROR with the SQL;
    # real database failures are still logged (with stack trace) by GlobalExceptionHandler.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

app:
  jwt:
    secret: ${JWT_SECRET}
    # A workday. Tokens are validated against the account on every request (cached 30 s), so a long TTL does not
    # mean a long window after a password change, role change or deactivation.
    ttl: ${JWT_TTL:8h}
    issuer: meeting-room-booking
  rules:
    timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
    workday-start: ${WORKDAY_START:08:00}
    workday-end: ${WORKDAY_END:20:00}
    slot-minutes: 15
    min-duration-minutes: 15
    max-duration-minutes: 240
    max-advance-days: ${MAX_ADVANCE_DAYS:30}
    max-series-days: ${MAX_SERIES_DAYS:90}
    max-active-bookings-per-user: ${MAX_ACTIVE_BOOKINGS:20}
    max-booked-minutes-per-day: ${MAX_BOOKED_MINUTES_PER_DAY:480}
    start-grace-minutes: 15
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:Administrator}
  rate-limit:
    writes-per-minute: ${WRITES_PER_MINUTE:30}
  login-protection:
    max-failures: 5
    lock-duration: 15m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
