# Runs the whole test-suite against a real PostgreSQL:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
# Separate project name: `down -v` here must never touch the real stack's containers/volumes.
name: daoukiwoom-test
services:
  db:
    image: postgres:16-alpine
    # test database: small and fast, durability is irrelevant here (and it keeps the memory footprint low)
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=60", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_DB: booking_test
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    healthcheck:
      test: ["CMD-SHELL", "psql -U booking -d booking_test -tAc 'select 1' | grep -q 1"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DB_URL: jdbc:postgresql://db:5432/booking_test
      MAVEN_OPTS: -Xmx160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    volumes:
      - .:/workspace
      - m2cache:/root/.m2
    command: mvn -B test "-DargLine=-Xmx380m -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1"
volumes:
  m2cache:
