# Runs the whole test-suite against a real PostgreSQL:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_test
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    healthcheck:
      test: ["CMD-SHELL", "psql -U booking -d booking_test -tAc 'select 1' | grep -q 1"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DB_URL: jdbc:postgresql://db:5432/booking_test
    volumes:
      - .:/workspace
      - m2cache:/root/.m2
    command: mvn -B test
volumes:
  m2cache:
